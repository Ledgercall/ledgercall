<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 72" width="300" height="72" role="img" aria-label="LEDGERCALL">
  <defs>
    <linearGradient id="lc-chip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#151a22"/>
      <stop offset="1" stop-color="#0d1014"/>
    </linearGradient>
  </defs>
  <!-- mark -->
  <g transform="translate(6,8) scale(0.875)">
    <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#lc-chip)" stroke="rgba(255,255,255,0.10)"/>
    <rect x="24" y="31" width="6" height="15" rx="2" fill="#8590a0"/>
    <rect x="33" y="22" width="6" height="24" rx="2" fill="#8ab4ff"/>
    <rect x="42" y="34" width="6" height="12" rx="2" fill="#8590a0"/>
    <path d="M18 17 V46 H49" fill="none" stroke="#eef1f5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- wordmark -->
  <text x="82" y="46" font-family="'Geist', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-size="29" font-weight="600" letter-spacing="2">
    <tspan fill="#eef1f5">LEDGER</tspan><tspan fill="#8ab4ff">CALL</tspan>
  </text>
</svg>
